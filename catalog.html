<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog | Coral — CZ Rose Gold Jewellery Collections</title>
  <meta name="description" content="Browse Coral's CZ Rose Gold jewellery catalog by category — necklaces, pendants, bracelets and watches. For browsing only; contact us for pricing and orders." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div id="header-placeholder"></div>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Our Collections</p>
        <h1>Product Catalog</h1>
        <p class="section-sub">Browse by category. For pricing, availability or bulk orders, please <a href="contact.html">get in touch</a>.</p>
      </div>
    </section>

    <section class="catalog-section">
      <div class="container">
        <div class="catalog-toolbar reveal">
          <div class="catalog-filters" id="catalogFilters" role="tablist" aria-label="Filter by category"></div>
          <div class="catalog-search">
            <label for="catalogSearch" class="visually-hidden">Search catalog</label>
            <input type="search" id="catalogSearch" placeholder="Search products…" />
          </div>
        </div>

        <div class="catalog-grid" id="catalogGrid" aria-live="polite"></div>
        <p class="catalog-empty" id="catalogEmpty" hidden>No products match your search or filter.</p>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/main.js" defer></script>
  <script src="js/catalog.js" defer></script>
</body>
</html>
