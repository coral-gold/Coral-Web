<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coral — Content Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <!-- Decap CMS (formerly Netlify CMS) — a free, open-source git-based admin
       panel. Login is handled by Netlify Identity + Git Gateway (see the
       setup notes in the project README / handover message), so Coral Gold
       staff sign in with an email + password here and edits are committed
       to GitHub automatically — no developer involvement needed. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
