name: Rebuild product catalog

on:
  push:
    paths:
      - "content/products/**.json"
      - "scripts/build-catalog.js"

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    # Skip commits made by this workflow itself to avoid an infinite loop
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate content/products.json
        run: node scripts/build-catalog.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/products.json
          git diff --staged --quiet || git commit -m "chore: rebuild product catalog [skip ci]"
          git push
